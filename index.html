/* ------------------------------------------------------------------ */
/*  Main app                                                            */
/* ------------------------------------------------------------------ */
function App() {
  const [view, setView] = useState({ page: "home" });
  const [works, setWorks] = useState(WORKS);
  const [follows, setFollows] = useState({});
  const [liked, setLiked] = useState({});
  const [draft, setDraft] = useState({ stars: 0, text: "", spoiler: false });
  const [showSpoiler, setShowSpoiler] = useState({});

  const goWork = (id) => { setDraft({ stars: 0, text: "", spoiler: false }); setView({ page: "work", id }); window.scrollTo(0, 0); };
  const goCreator = (id) => { setView({ page: "creator", id }); window.scrollTo(0, 0); };
  const goCollective = (id) => { setView({ page: "collective", id }); window.scrollTo(0, 0); };
  const goHome = () => { setView({ page: "home" }); window.scrollTo(0, 0); };

  const toggleFollow = (id) => setFollows((f) => ({ ...f, [id]: !f[id] }));
  const toggleLike = (id) => {
    setLiked((l) => ({ ...l, [id]: !l[id] }));
    setWorks((ws) => ws.map((w) => w.id === id ? { ...w, likes: w.likes + (liked[id] ? -1 : 1) } : w));
  };
  const postReview = (workId) => {
    if (!draft.stars || !draft.text.trim()) return;
    setWorks((ws) => ws.map((w) => w.id === workId ? { ...w, reviews: [{ user: "You", ...draft }, ...w.reviews] } : w));
    setDraft({ stars: 0, text: "", spoiler: false });
  };

  const avg = (w) => w.reviews.length ? (w.reviews.reduce((s, r) => s + r.stars, 0) / w.reviews.length).toFixed(1) : null;

  return (
    <div style={{ background: T.bg, color: T.text, minHeight: "100vh", fontFamily: body }}>
      <header style={{
        display: "flex", alignItems: "baseline", gap: 18, flexWrap: "wrap",
        padding: "20px 22px 16px", borderBottom: `1px solid ${T.line}`,
        position: "sticky", top: 0, background: `${T.bg}F2`, backdropFilter: "blur(8px)", zIndex: 10,
      }}>
        <div onClick={goHome} style={{ fontFamily: display, fontWeight: 700, fontSize: 24, cursor: "pointer", letterSpacing: 1 }}>
          The Screening Room<span style={{ color: T.amber }}>.</span>
          <span style={{ fontSize: 10.5, color: T.sub, marginLeft: 12, letterSpacing: 3, fontFamily: body, fontWeight: 400, textTransform: "uppercase" }}>Where films and filmmakers get found</span>
        </div>
        <nav style={{ marginLeft: "auto", display: "flex", gap: 18, fontSize: 12.5, color: T.sub }}>
          <span onClick={goHome} style={{ cursor: "pointer", color: view.page === "home" ? T.amber : T.sub }}>Discover</span>
          <span style={{ cursor: "pointer" }}>Submit a film</span>
        </nav>
      </header>

      <main style={{ maxWidth: 880, margin: "0 auto", padding: "26px 22px 80px" }}>
        {view.page === "home" && <Home works={works} avg={avg} goWork={goWork} goCreator={goCreator} goCollective={goCollective} />}
        {view.page === "work" && (
          <WorkPage
            work={works.find((w) => w.id === view.id)}
            avg={avg} liked={liked} toggleLike={toggleLike}
            goCreator={goCreator} goWork={goWork} goCollective={goCollective} works={works}
            draft={draft} setDraft={setDraft} postReview={postReview}
            showSpoiler={showSpoiler} setShowSpoiler={setShowSpoiler}
          />
        )}
        {view.page === "creator" && (
          <CreatorPage
            creator={CREATORS[view.id]} works={works}
            follows={follows} toggleFollow={toggleFollow}
            goWork={goWork} goCollective={goCollective} avg={avg}
          />
        )}
        {view.page === "collective" && (
          <CollectivePage
            collective={COLLECTIVES[view.id]} works={works}
            follows={follows} toggleFollow={toggleFollow}
            goWork={goWork} goCreator={goCreator} avg={avg}
          />
        )}
      </main>

      <footer style={{ borderTop: `1px solid ${T.line}`, padding: "18px 22px", fontSize: 11, color: T.sub, letterSpacing: 1 }}>
        The Screening Room — interactive prototype. Data is not saved.
      </footer>
    </div>
  );
}

function Home({ works, avg, goWork, goCreator, goCollective }) {
  const pick = works.find((w) => w.editorsPick);
  const ranked = [...works].slice().sort((a, b) => b.likes - a.likes);
  return (
    <div>
      <div style={{ fontSize: 11, letterSpacing: 3, color: T.amber, marginBottom: 10, textTransform: "uppercase" }}>Editor's pick</div>
      <Thumb work={pick} h={300} onClick={() => goWork(pick.id)} />
      <div style={{ display: "flex", gap: 14, alignItems: "baseline", margin: "14px 2px 6px", flexWrap: "wrap" }}>
        <span style={{ fontFamily: display, fontSize: 26, fontWeight: 700, cursor: "pointer" }} onClick={() => goWork(pick.id)}>{pick.title}</span>
        <span style={{ color: T.sub, fontSize: 12 }}>{pick.year} · {pick.min} min</span>
        {avg(pick) && <span style={{ fontSize: 13 }}><Stars n={Math.round(avg(pick))} /> <span style={{ color: T.sub, fontSize: 12 }}>{avg(pick)}</span></span>}
      </div>
      <p style={{ color: T.sub, fontSize: 13.5, lineHeight: 1.8, maxWidth: 620, margin: "0 2px" }}>{pick.synopsis}</p>
      <div style={{ margin: "10px 2px 0", fontSize: 12.5, color: T.sub }}>
        Directed by{" "}
        <span onClick={() => goCreator(pick.credits[0].id)} style={{ color: T.amber, cursor: "pointer" }}>
          {CREATORS[pick.credits[0].id].name}
        </span>
      </div>

      <SectionTitle>Under 1,000 views</SectionTitle>
      <div style={{ fontSize: 12.5, color: T.sub, margin: "-8px 0 14px" }}>Be early. Almost nobody has seen these yet.</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 16 }}>
        {works.filter((w) => w.views < 1000).sort((a, b) => a.views - b.views).map((w) => (
          <div key={w.id}>
            <Thumb work={w} onClick={() => goWork(w.id)} />
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 8 }}>
              <span onClick={() => goWork(w.id)} style={{ fontSize: 13.5, fontWeight: 500, cursor: "pointer" }}>{w.title}</span>
              <span style={{ fontSize: 11, color: T.amber }}>{w.views} views</span>
            </div>
          </div>
        ))}
      </div>

      <SectionTitle>In production now</SectionTitle>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 14 }}>
        {["c1", "c2", "c3"].map((id) => {
          const c = CREATORS[id];
          return (
            <div key={id} onClick={() => goCreator(id)} style={{
              background: T.surface, border: `1px solid ${T.line}`, borderRadius: 3,
              padding: "12px 14px", cursor: "pointer",
            }}>
              <StatusBadge status={c.status} />
              <div style={{ fontSize: 13.5, fontWeight: 500, marginTop: 8 }}>{c.name}</div>
              <div style={{ fontSize: 12, color: T.sub, marginTop: 2 }}>{c.statusWork}</div>
            </div>
          );
        })}
      </div>

      <SectionTitle>New in The Screening Room</SectionTitle>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 16 }}>
        {works.map((w) => (
          <div key={w.id}>
            <Thumb work={w} onClick={() => goWork(w.id)} />
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 8 }}>
              <span onClick={() => goWork(w.id)} style={{ fontSize: 13.5, fontWeight: 500, cursor: "pointer" }}>{w.title}</span>
              {avg(w) && <span style={{ fontSize: 11, color: T.sub }}>★ {avg(w)}</span>}
            </div>
            <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>{w.genre.map((g) => <Tag key={g}>{g}</Tag>)}</div>
          </div>
        ))}
      </div>

      <SectionTitle>Latest activity</SectionTitle>
      <div style={{ border: `1px solid ${T.line}`, borderRadius: 3 }}>
        {UPDATES.map((u, i) => {
          const isGroup = u.who.startsWith("g");
          const name = isGroup ? COLLECTIVES[u.who].name : CREATORS[u.who].name;
          return (
            <div key={i} onClick={() => isGroup ? goCollective(u.who) : goCreator(u.who)} style={{
              display: "flex", alignItems: "baseline", gap: 12, padding: "12px 16px",
              borderBottom: i < UPDATES.length - 1 ? `1px solid ${T.line}` : "none", cursor: "pointer", flexWrap: "wrap",
            }}>
              <span style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color: T.amber, width: 78 }}>{u.kind}</span>
              <span style={{ fontSize: 13, fontWeight: 500 }}>{name}</span>
              {!isGroup && CREATORS[u.who].sample && <SampleBadge />}
              <span style={{ fontSize: 13, color: T.sub }}>{u.text}</span>
              <span style={{ marginLeft: "auto", fontSize: 11, color: T.sub }}>{u.when}</span>
            </div>
          );
        })}
      </div>

      <SectionTitle>Most liked</SectionTitle>
      <div style={{ border: `1px solid ${T.line}`, borderRadius: 3 }}>
        {ranked.map((w, i) => (
          <div key={w.id} onClick={() => goWork(w.id)} style={{
            display: "flex", alignItems: "baseline", gap: 16, padding: "13px 16px",
            borderBottom: i < ranked.length - 1 ? `1px solid ${T.line}` : "none", cursor: "pointer",
          }}>
            <span style={{ fontFamily: display, color: i === 0 ? T.amber : T.sub, width: 22, fontSize: 17 }}>{i + 1}</span>
            <span style={{ fontSize: 14 }}>{w.title}</span>
            <span style={{ marginLeft: "auto", fontSize: 12, color: T.sub }}>♥ {w.likes}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Film page                                                           */
/* ------------------------------------------------------------------ */
function WorkPage({ work, avg, liked, toggleLike, goCreator, goWork, goCollective, works, draft, setDraft, postReview, showSpoiler, setShowSpoiler }) {
  const [showEpk, setShowEpk] = useState(false);
  const related = works.filter((w) =>
    w.id !== work.id && w.credits.some((c) => work.credits.some((c2) => c2.id === c.id))
  );
  return (
    <div>
      {work.yt ? (
        <div style={{ aspectRatio: "16/9", borderRadius: 3, overflow: "hidden", border: `1px solid ${T.line}`, background: "#000" }}>
          <iframe
            width="100%" height="100%"
            src={`https://www.youtube-nocookie.com/embed/${work.yt}`}
            title={work.title}
            frameBorder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowFullScreen
            style={{ display: "block" }}
          />
        </div>
      ) : (
        <div style={{
          aspectRatio: "16/9", background: `linear-gradient(160deg, ${work.hue}, #000)`,
          borderRadius: 3, display: "flex", alignItems: "center", justifyContent: "center",
          border: `1px solid ${T.line}`, color: T.sub, fontSize: 12, letterSpacing: 2,
        }}>
          ▶ Video coming soon
        </div>
      )}

      {work.collective && (
        <div onClick={() => goCollective(work.collective)} style={{
          marginTop: 18, fontSize: 11, letterSpacing: 3, textTransform: "uppercase",
          color: T.amber, cursor: "pointer",
        }}>A {COLLECTIVES[work.collective].name} film →</div>
      )}

      <div style={{ display: "flex", alignItems: "baseline", gap: 14, margin: "20px 0 4px", flexWrap: "wrap" }}>
        <h1 style={{ fontFamily: display, fontSize: 36, fontWeight: 700, margin: 0 }}>{work.title}</h1>
        {work.sample && <SampleBadge />}
        <span style={{ color: T.sub, fontSize: 13 }}>{work.year} · {work.min} min · {work.views.toLocaleString()} views</span>
        <button onClick={() => toggleLike(work.id)} style={{
          marginLeft: "auto", background: "none", cursor: "pointer",
          border: `1px solid ${liked[work.id] ? T.amber : T.line}`,
          color: liked[work.id] ? T.amber : T.sub,
          padding: "6px 14px", borderRadius: 999, fontSize: 12.5,
        }}>♥ {work.likes}</button>
      </div>
      <div style={{ display: "flex", gap: 8, margin: "8px 0 16px", flexWrap: "wrap" }}>{work.genre.map((g) => <Tag key={g}>{g}</Tag>)}</div>
      <p style={{ color: T.text, fontSize: 14, lineHeight: 1.9, maxWidth: 640, opacity: 0.9 }}>{work.synopsis}</p>

      <SectionTitle>Credits</SectionTitle>
      <div style={{ maxWidth: 480 }}>
        {work.credits.map((c) => (
          <div key={c.role + c.id} style={{ display: "flex", alignItems: "baseline", padding: "9px 0", borderBottom: `1px dotted ${T.line}` }}>
            <span style={{ fontSize: 10.5, letterSpacing: 2, color: T.sub, width: 150, textTransform: "uppercase" }}>{c.role}</span>
            <span onClick={() => goCreator(c.id)} style={{ fontFamily: display, fontSize: 17, color: T.text, cursor: "pointer" }}>
              {CREATORS[c.id].name}
            </span>
            <span onClick={() => goCreator(c.id)} style={{ marginLeft: "auto", fontSize: 11, color: T.amber, cursor: "pointer" }}>Profile →</span>
          </div>
        ))}
      </div>

      {work.festival && work.festival.length > 0 && (
        <React.Fragment>
          <SectionTitle>Festivals & awards</SectionTitle>
          <div style={{ maxWidth: 600 }}>
            {work.festival.map((e, i) => <ResultChip key={i} e={e} />)}
          </div>
        </React.Fragment>
      )}

      <div style={{ marginTop: 22, display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
        <button onClick={() => setShowEpk(!showEpk)} style={{
          background: "transparent", color: T.amber, border: `1px solid ${T.amberDim}`,
          padding: "8px 18px", borderRadius: 2, fontSize: 12.5, cursor: "pointer", letterSpacing: 1,
        }}>Press kit (PDF) · Pro</button>
        <span style={{ fontSize: 12, color: T.sub }}>One click: stills, synopsis, credits, verified laurels, contact.</span>
      </div>
      {showEpk && (
        <div style={{ marginTop: 12, background: T.surface, border: `1px solid ${T.line}`, borderRadius: 3, padding: 16, fontSize: 13, color: T.sub, maxWidth: 600, lineHeight: 1.8 }}>
          Pro preview. The press kit bundles this page as a submission-ready PDF: poster frame, synopsis, full credits with profile links, festival laurels with verification, and your contact block. Part of the Pro plan, alongside private screener pages and audience analytics.
        </div>
      )}

      <SectionTitle>Reviews {work.reviews.length > 0 ? <span style={{ color: T.sub, fontSize: 12, fontFamily: body, fontWeight: 400 }}> avg ★{avg(work)} ({work.reviews.length})</span> : null}</SectionTitle>

      <div style={{ background: T.surface, border: `1px solid ${T.line}`, borderRadius: 3, padding: 16, marginBottom: 22 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 10 }}>
          <Stars n={draft.stars} size={18} onPick={(i) => setDraft((d) => ({ ...d, stars: i }))} />
          <label style={{ fontSize: 11.5, color: T.sub, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
            <input type="checkbox" checked={draft.spoiler} onChange={(e) => setDraft((d) => ({ ...d, spoiler: e.target.checked }))} />
            Contains spoilers
          </label>
        </div>
        <textarea
          value={draft.text}
          onChange={(e) => setDraft((d) => ({ ...d, text: e.target.value }))}
          placeholder="Write your review"
          rows={3}
          style={{
            width: "100%", boxSizing: "border-box", background: T.bg, color: T.text,
            border: `1px solid ${T.line}`, borderRadius: 3, padding: 10, fontSize: 13.5,
            fontFamily: body, resize: "vertical",
          }}
        />
        <button onClick={() => postReview(work.id)} disabled={!draft.stars || !draft.text.trim()} style={{
          marginTop: 10, background: draft.stars && draft.text.trim() ? T.amber : T.surface2,
          color: draft.stars && draft.text.trim() ? T.bg : T.sub,
          border: "none", padding: "8px 22px", borderRadius: 2, fontSize: 13, fontWeight: 700,
          cursor: draft.stars && draft.text.trim() ? "pointer" : "default", letterSpacing: 1,
        }}>Post review</button>
      </div>

      {work.reviews.length === 0 && (
        <div style={{ color: T.sub, fontSize: 13 }}>No reviews yet. Be the first to write one.</div>
      )}
      {work.reviews.map((r, i) => (
        <div key={i} style={{ padding: "14px 0", borderBottom: `1px solid ${T.line}` }}>
          <div style={{ display: "flex", gap: 12, alignItems: "baseline", marginBottom: 6 }}>
            <span style={{ fontSize: 13, fontWeight: 700 }}>{r.user}</span>
            <Stars n={r.stars} />
            {r.spoiler && <span style={{ fontSize: 10.5, color: T.amber }}>Spoilers</span>}
          </div>
          {r.spoiler && !showSpoiler[work.id + i] ? (
            <button onClick={() => setShowSpoiler((s) => ({ ...s, [work.id + i]: true }))} style={{
              background: T.surface2, color: T.sub, border: `1px solid ${T.line}`,
              padding: "6px 14px", borderRadius: 2, fontSize: 12, cursor: "pointer",
            }}>Show spoiler</button>
          ) : (
            <p style={{ fontSize: 13.5, lineHeight: 1.8, color: T.text, opacity: 0.85, margin: 0 }}>{r.text}</p>
          )}
        </div>
      ))}

      {related.length > 0 && (
        <React.Fragment>
          <SectionTitle>More from the people behind this film</SectionTitle>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 16 }}>
            {related.map((w) => (
              <div key={w.id}>
                <Thumb work={w} onClick={() => goWork(w.id)} />
                <div style={{ fontSize: 13, marginTop: 8, cursor: "pointer" }} onClick={() => goWork(w.id)}>{w.title}</div>
              </div>
            ))}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Creator page                                                        */
/* ------------------------------------------------------------------ */
function CreatorPage({ creator, works, follows, toggleFollow, goWork, goCollective, avg }) {
  const filmo = works.filter((w) => w.credits.some((c) => c.id === creator.id));
  const following = follows[creator.id];
  const memberOf = Object.values(COLLECTIVES).filter((g) => g.members.includes(creator.id));
  /* Festival results aggregate from the works: personal nominations, plus film-level results of credited films */
  const festivalResults = [];
  works.forEach((w) => {
    (w.festival || []).forEach((e) => {
      const credited = w.credits.some((c) => c.id === creator.id);
      if (e.who === creator.id || (credited && !e.who)) festivalResults.push({ e, workTitle: w.title });
    });
  });
  return (
    <div>
      <div style={{ display: "flex", gap: 22, alignItems: "flex-start", flexWrap: "wrap" }}>
        <div style={{
          width: 88, height: 88, borderRadius: "50%", background: T.surface2,
          border: `1px solid ${T.line}`, display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: display, fontSize: 36, color: T.amber, flexShrink: 0,
        }}>{creator.name[0]}</div>
        <div style={{ flex: 1, minWidth: 240 }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
            <h1 style={{ fontFamily: display, fontSize: 32, fontWeight: 700, margin: 0 }}>{creator.name}</h1>
            {creator.sample && <SampleBadge />}
            <span style={{ color: T.sub, fontSize: 12, letterSpacing: 1 }}>{creator.role}</span>
          </div>
          <p style={{ color: T.sub, fontSize: 13.5, lineHeight: 1.8, margin: "10px 0 12px", maxWidth: 560 }}>{creator.bio}</p>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            <button onClick={() => toggleFollow(creator.id)} style={{
              background: following ? "transparent" : T.amber,
              color: following ? T.amber : T.bg,
              border: `1px solid ${T.amber}`, padding: "8px 22px", borderRadius: 999,
              fontSize: 13, fontWeight: 700, cursor: "pointer", letterSpacing: 1,
            }}>{following ? "Following" : "Follow"}</button>
            {memberOf.map((g) => (
              <span key={g.id} onClick={() => goCollective(g.id)} style={{
                fontSize: 11.5, color: T.amber, border: `1px solid ${T.amberDim}`,
                padding: "6px 12px", borderRadius: 999, cursor: "pointer",
              }}>{g.name}</span>
            ))}
            {Object.keys(creator.sns).map((s) => (
              <a key={s} href={creator.sns[s]} style={{ fontSize: 11.5, color: T.sub, textDecoration: "none", border: `1px solid ${T.line}`, padding: "6px 12px", borderRadius: 999 }}>{s}</a>
            ))}
          </div>
        </div>
      </div>

      <SectionTitle>Now making</SectionTitle>
      <div style={{ display: "flex", alignItems: "center", gap: 14, background: T.surface, border: `1px solid ${T.line}`, borderRadius: 3, padding: "14px 18px", flexWrap: "wrap" }}>
        <StatusBadge status={creator.status} />
        <span style={{ fontSize: 13.5 }}>{creator.statusWork}</span>
        <span style={{ marginLeft: "auto", fontSize: 11.5, color: T.sub }}>Read the production diary →</span>
      </div>

      {(festivalResults.length > 0 || creator.awards.length > 0) && (
        <React.Fragment>
          <SectionTitle>Awards & selections</SectionTitle>
          <div style={{ maxWidth: 600 }}>
            {festivalResults.map((r, i) => <ResultChip key={i} e={r.e} workTitle={r.workTitle} />)}
            {creator.awards.map((a) => (
              <div key={a} style={{ fontSize: 13, color: T.text, opacity: 0.85, padding: "7px 0", borderBottom: `1px dotted ${T.line}` }}>◆ {a}</div>
            ))}
          </div>
        </React.Fragment>
      )}

      <SectionTitle>Filmography</SectionTitle>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 16 }}>
        {filmo.map((w) => {
          const role = w.credits.find((c) => c.id === creator.id).role;
          return (
            <div key={w.id}>
              <Thumb work={w} onClick={() => goWork(w.id)} />
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 8 }}>
                <span onClick={() => goWork(w.id)} style={{ fontSize: 13.5, cursor: "pointer" }}>{w.title}</span>
                <span style={{ fontSize: 10, color: T.sub, letterSpacing: 1, textTransform: "uppercase" }}>{role}</span>
              </div>
              {avg(w) && <div style={{ fontSize: 11, color: T.sub, marginTop: 4 }}>★ {avg(w)}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Collective page                                                     */
/* ------------------------------------------------------------------ */
function CollectivePage({ collective, works, follows, toggleFollow, goWork, goCreator, avg }) {
  const filmo = works.filter((w) => w.collective === collective.id);
  const following = follows[collective.id];
  return (
    <div>
      <div style={{ fontSize: 11, letterSpacing: 3, color: T.sub, textTransform: "uppercase", marginBottom: 8 }}>Collective</div>
      <h1 style={{ fontFamily: display, fontSize: 40, fontWeight: 700, margin: 0 }}>{collective.name}</h1>
      <div style={{ color: T.sub, fontSize: 12.5, letterSpacing: 1, margin: "6px 0 14px" }}>{collective.tagline}</div>
      <p style={{ color: T.sub, fontSize: 13.5, lineHeight: 1.8, maxWidth: 560, margin: "0 0 14px" }}>{collective.bio}</p>
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
        <button onClick={() => toggleFollow(collective.id)} style={{
          background: following ? "transparent" : T.amber,
          color: following ? T.amber : T.bg,
          border: `1px solid ${T.amber}`, padding: "8px 22px", borderRadius: 999,
          fontSize: 13, fontWeight: 700, cursor: "pointer", letterSpacing: 1,
        }}>{following ? "Following" : "Follow"}</button>
        {Object.keys(collective.sns).map((s) => (
          <a key={s} href={collective.sns[s]} style={{ fontSize: 11.5, color: T.sub, textDecoration: "none", border: `1px solid ${T.line}`, padding: "6px 12px", borderRadius: 999 }}>{s}</a>
        ))}
      </div>

      <SectionTitle>Members</SectionTitle>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 14 }}>
        {collective.members.map((id) => {
          const m = CREATORS[id];
          return (
            <div key={id} onClick={() => goCreator(id)} style={{
              display: "flex", alignItems: "center", gap: 12, cursor: "pointer",
              background: T.surface, border: `1px solid ${T.line}`, borderRadius: 3, padding: "12px 14px",
            }}>
              <div style={{
                width: 40, height: 40, borderRadius: "50%", background: T.surface2,
                border: `1px solid ${T.line}`, display: "flex", alignItems: "center", justifyContent: "center",
                fontFamily: display, fontSize: 17, color: T.amber, flexShrink: 0,
              }}>{m.name[0]}</div>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 500 }}>{m.name}</div>
                <div style={{ fontSize: 10.5, color: T.sub, letterSpacing: 1, textTransform: "uppercase" }}>{m.role}</div>
              </div>
            </div>
          );
        })}
      </div>

      <SectionTitle>Films</SectionTitle>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 16 }}>
        {filmo.map((w) => (
          <div key={w.id}>
            <Thumb work={w} onClick={() => goWork(w.id)} />
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 8 }}>
              <span onClick={() => goWork(w.id)} style={{ fontSize: 13.5, cursor: "pointer" }}>{w.title}</span>
              {avg(w) && <span style={{ fontSize: 11, color: T.sub }}>★ {avg(w)}</span>}
            </div>
          </div>
        ))}
      </div>

      <SectionTitle>Activity</SectionTitle>
      <div style={{ border: `1px solid ${T.line}`, borderRadius: 3 }}>
        {UPDATES.filter((u) => u.who === collective.id || collective.members.includes(u.who)).map((u, i, arr) => {
          const isGroup = u.who.startsWith("g");
          const name = isGroup ? collective.name : CREATORS[u.who].name;
          return (
            <div key={i} style={{
              display: "flex", alignItems: "baseline", gap: 12, padding: "12px 16px",
              borderBottom: i < arr.length - 1 ? `1px solid ${T.line}` : "none", flexWrap: "wrap",
            }}>
              <span style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color: T.amber, width: 78 }}>{u.kind}</span>
              <span style={{ fontSize: 13, fontWeight: 500 }}>{name}</span>
              <span style={{ fontSize: 13, color: T.sub }}>{u.text}</span>
              <span style={{ marginLeft: "auto", fontSize: 11, color: T.sub }}>{u.when}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
